#
# Servidor estático del panel.
#
# Dos cosas que, mal puestas, se pagan caras:
#
#  1. **El `index.html` no se cachea.** Es el fichero que apunta a los bundles
#     con hash; si un proxy lo guarda, el navegador sigue pidiendo la versión
#     anterior después de desplegar y el panel se queda congelado en la de
#     ayer sin que nada falle visiblemente.
#  2. **Los bundles con hash sí, y para siempre.** Su nombre cambia con el
#     contenido, así que nunca sirven algo obsoleto.
#
# Y una trampa de nginx que cuesta descubrir: `add_header` NO se hereda. En
# cuanto un `location` declara uno propio, TODOS los del bloque `server`
# desaparecen para esa ruta. Aquí se detectó sirviendo el panel sin
# `X-Robots-Tag` pese a estar declarado arriba, así que las cabeceras se
# repiten en cada bloque a propósito.
#

#
# La IP real del cliente.
#
# La petición llega con dos saltos delante: Cloudflare y Traefik. Sin esto,
# cada línea del registro diría que todo el tráfico viene de la IP interna del
# proxy —172.x—, que es inútil para diagnosticar nada: un pico de errores de
# un cliente concreto sería indistinguible de un pico general.
#
# La cabecera llega así: `X-Forwarded-For: <cliente>, <borde de Cloudflare>`.
# nginx la recorre de derecha a izquierda y se queda con la primera dirección
# que NO sea de confianza. Por eso hay que declarar de confianza tanto las
# redes de Docker (Traefik) como los rangos de Cloudflare: sin los segundos,
# nginx se para en el borde de Cloudflare y registra su IP como si fuera la
# del cliente —que es exactamente lo que hacía antes de esta lista—.
#
# Los rangos son los mismos que confía Traefik. Cloudflare los cambia de vez
# en cuando: `scripts/cortafuegos-cloudflare.sh` los vuelve a descargar, y
# conviene revisar también esta lista cuando eso pase.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Ficheros con hash en el nombre: inmutables.
    location /assets/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        try_files $uri =404;
    }

    # Cualquier otra ruta la resuelve el enrutador del cliente.
    location / {
        # El panel nunca debe indexarse: expone la operativa del negocio.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
