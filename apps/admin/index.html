<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El admin nunca debe indexarse: expone la operativa del negocio. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Administración</title>
    <script>
      // Se aplica el tema ANTES de pintar nada: si se hiciera en React, la
      // pantalla parpadearía en blanco durante un instante al cargar en oscuro.
      (function () {
        var t = localStorage.getItem('tema-admin') || 'system';
        var oscuro =
          t === 'dark' ||
          (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (oscuro) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
